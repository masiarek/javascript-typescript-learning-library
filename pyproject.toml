[project]
name = "javascript-typescript-learning-library"
version = "0.1.0"
description = "A runnable learning library about JavaScript and TypeScript, published as a searchable site."
requires-python = ">=3.11"
dependencies = []

# Not an installable package — just a place to pin the docs toolchain so CI and
# the local preview resolve the exact same versions from uv.lock.
[tool.uv]
package = false

[dependency-groups]
# The MkDocs site build. To change a docs dependency, edit here and run `uv lock`.
# mkdocs-same-dir is pinned exactly: it is the plugin that lets the docs root be
# the repo root, and it is the one most likely to break the whole build silently.
#
# The examples' own toolchain is not here: Node runs them, and the TypeScript
# compiler that checks them is pinned in package.json / package-lock.json.
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-same-dir==0.1.3",
]
