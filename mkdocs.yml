# MkDocs Material site for the whole repo — publishes every Markdown page as a
# searchable website on GitHub Pages.
#
#   Local preview:  uv run --group docs mkdocs serve
#                   (toolchain pinned in pyproject.toml [dependency-groups].docs + uv.lock)
#   Deploy:         .github/workflows/docs.yml builds on every push to master
#                   (one-time setup: repo Settings → Pages → Source: GitHub Actions,
#                    and widen the github-pages environment's branch policy to master)
#
# The docs root IS the repo root (mkdocs-same-dir), so there is no docs/ copy step:
# the same Markdown GitHub renders is what the site serves, and the example sources
# and their recorded .out keys are carried through as static files, so links to
# them keep working.

site_name: JavaScript and TypeScript — Learning Library
site_description: JavaScript and TypeScript one page at a time — values, coercion, closures, the event loop, modules, Node, and the TypeScript type system — every claim backed by a program that Node runs and tsc checks, on two machines, in CI.
site_url: https://masiarek.github.io/javascript-typescript-learning-library/
repo_url: https://github.com/masiarek/javascript-typescript-learning-library
repo_name: masiarek/javascript-typescript-learning-library
edit_uri: edit/master/

docs_dir: .
site_dir: site

# Cross-links are authored for GitHub's file-relative rendering (including links
# to a folder's README.md). Plain .html pages keep those exact semantics; pretty
# directory URLs would shift every page one level deeper and break them.
use_directory_urls: false

# MkDocs maps README.md onto index.md, so the root README and index.md collide.
# Its content already IS the homepage, inlined by index.md through
# pymdownx.snippets. CLAUDE.md is operational notes for an assistant, not a page.
#
# The leading slash anchors a pattern to the repo root. Without it, .gitignore
# semantics would match README.md at ANY depth and silently delete every folder's
# section landing page from the site.
#
# node_modules/ holds the pinned TypeScript compiler (package.json). It sits in
# the docs root, and every package in it ships a README.md -- left in, each one
# would become a page and --strict would fail on their links.
exclude_docs: |
  /README.md
  /CLAUDE.md
  __pycache__/
  node_modules/
  .claude/

# Built and linkable, but kept out of the sidebar: house conventions are for
# someone about to write a page, not for a reader browsing lessons.
not_in_nav: |
  /CONTRIBUTING.md

theme:
  name: material
  icon:
    logo: material/language-typescript
  features:
    - navigation.indexes    # a folder's README.md becomes its section landing page
    # Every section open by default: the sidebar is the table of contents, and
    # a reader scans the whole list of topics rather than unfolding chapters
    # one at a time.
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Build-time fixes that would otherwise need a plugin (and a new pinned
# dependency): sidebar labels, reading order, and the footer's prev/next chain.
hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - same-dir

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # A stub's "Examples it will need" is a checklist.
  - pymdownx.tasklist:
      custom_checkbox: true
  # Lets index.md inline README.md, so the repo front page and the site homepage
  # share one source and cannot drift.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/masiarek/javascript-typescript-learning-library
